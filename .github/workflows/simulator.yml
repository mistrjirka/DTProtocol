name: Protocol simulator

on:
  push:
    branches: [main, protocol-simulator, protocol-v2]
  pull_request:

jobs:
  python-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: PYTHONPATH=simulator python -m pytest simulator/tests -q -rxX

  real-cpp-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: cmake -S simulator/cpp -B simulator/cpp/build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - run: cmake --build simulator/cpp/build --parallel 2
      - run: PYTHONPATH=simulator python -m pytest simulator/tests -q -rxX

  real-cpp-sanitizers:
    # protocol-v2 is expected to be memory-safe on the host harness. Unlike the
    # reference branch, sanitizer findings are a hard failure here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: cmake -S simulator/cpp -B simulator/cpp/build-asan -DCMAKE_BUILD_TYPE=Debug -DDTP_HOST_SANITIZERS=ON
      - run: cmake --build simulator/cpp/build-asan --parallel 2
      - run: >-
          DTP_CPP_NODE="$PWD/simulator/cpp/build-asan/dtprotocol_host_node"
          PYTHONPATH=simulator
          python -m pytest simulator/tests -q -rxX
